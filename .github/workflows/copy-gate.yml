name: copy gate

# Publishing here is public and automatic: a merge to main auto-deploys via
# Mintlify. So the only place a tell can be caught is before the merge.
#
# On 2026-09-25 a changelog entry shipped with three em-dashes and two
# semicolons, when every prior entry had zero, and it was corrected live. The
# rule existed in the founder's standing instructions and nowhere a machine
# could enforce it. This is the enforcement.
#
# --strict matters: plain `detell` exits 1 only on the punctuation it can
# auto-fix, so a semicolon in prose would print and pass. Two of the five tells
# in that entry were semicolons.

on:
  pull_request:
    paths:
      - "**/*.mdx"
      - "**/*.md"
      - ".github/workflows/copy-gate.yml"
  push:
    branches: [main]
    paths:
      - "**/*.mdx"
      - "**/*.md"
  workflow_dispatch:

jobs:
  detell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The shared fleet tool. Pinned to a tag rather than a branch so a change
      # in detell cannot silently alter what this repo publishes, and so a
      # broken main over there cannot block a docs merge here.
      - name: Install detell
        run: npm install -g github:moxzas/detell#main

      # SCOPE: directories that are clean today, so the gate is green from the
      # first run and any failure means someone just introduced a tell.
      #
      # Deliberately NOT gated yet, with counts taken 2026-09-26:
      #   api-reference/  8 files flagged. GENERATED from docs/LLM_GUIDE.md,
      #                   which is machine-facing and exempt. Gating it would
      #                   demand hand-edits that the next regeneration wipes.
      #                   Fix the generator or accept it.
      #   guides/         3 files flagged (rule-of-three, not-X-but-Y)
      #   trust/          2 files flagged
      # Those are pre-existing prose in published pages. Editing them is the
      # founder's call, not a side effect of adding a gate. Add each directory
      # here once it is clean.
      - name: Check copy a human reads
        run: |
          detell --strict changelog/ use-cases/
          echo "clean"

      # A failure here is not a style nit. It is the difference between a
      # sceptical builder reading this and believing a person wrote it.
      - name: Explain a failure
        if: failure()
        run: |
          cat <<'MSG'
          Copy carries an AI tell. Nothing is published until it is fixed.

            detell --fix <file>    deterministic punctuation cleanup
            detell notes           the knowledge base behind the rules

          Structural flags (semicolon in prose, "not X, but Y", rule-of-three)
          are NOT auto-fixable by design. Rewrite the sentence.

          Machine-facing text is exempt and belongs in .detellignore, not in a
          weakened gate: llms.txt, an API contract, generated mirrors. Those are
          parsed, not read for impression.
          MSG
          exit 1
